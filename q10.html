<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p >Product: <span id="prodname"></span></p>
    <p >Price: <span id="cartDetails"></span></p>
    <script>
        let prodname =  document.getElementById("prodname")
        let cartDetails =  document.getElementById("cartDetails")
        let cart = {
            product:"tv",
            price:43000
        }
        localStorage.setItem("cart",JSON.stringify(cart))
        let showCart =  JSON.parse(localStorage.getItem("cart"))
        prodname.textContent =  showCart.product
        cartDetails.textContent =  showCart.price
    </script>
</body>
</html>
